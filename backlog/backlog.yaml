# Second Avenue contract-risk data product: backlog
#
# Source of truth for the GitHub Issues backlog and for the Phase 5 page
# (docs/phase-5-backlog-roadmap.html). Every story traces to a requirement in
# the revised PRD (docs/phase-3-prd.html, revision 2): DPR-n for data product
# requirements, NFR-n for non-functional ones.
#
# Planned from the revised PRD, after the Phase 4 prototype.
#
# Product writes functional stories: who it is for, why, and what done looks
# like. Engineering breaks each story into technical tasks and plans the
# sprints, by its own method; the refinement session is on the Phase 5 page.
# `tasks` is filled in where refinement broke a story down.

prd: https://caioluthi.github.io/portfolio/phase-3-prd.html
page: https://caioluthi.github.io/portfolio/phase-5-backlog-roadmap.html

tech_lead: Tomás, Tech Lead, Data Platform

personas:
  maria: Maria, Ops contract manager
  david: David, Finance
  priya: Priya, data analyst

milestones:
  now:
    name: Does it hold on real data
    exit: The go-live report shows every go-live criterion met on real history.
  next:
    name: Pilot live with Ops and Finance
    exit: Ops works the morning list daily and the scorecard is inside its guardrails.
  later:
    name: Self-serve questions
    exit: The question layer passes its evaluation set and Ops has access.

# Decision points drawn on the roadmap.
gates:
  appraisal_recovery:
    story: E1-S2
    when: week 1
    rule: If recovered intake appraisals cover at least 95% of items on contracts closed in the last 12 months, the backtest runs on real history. Otherwise the flag runs in the background on new contracts from sprint 3, when the new field ships, until a full 90-day window has closed, and both pilots move to about week 20. R1 is unaffected.
  go_live:
    story: E3-S2
    when: week 6
    rule: The pilot starts only if the go-live report shows every criterion met. Otherwise the settings come back to Product; if no setting meets every guardrail, the pilot doesn't start and listing-activity signals move up from next scope.

# Open questions. OQ-3 (listings) and OQ-6 (channel attribution) were closed
# by the prototype; the rest were settled in refinement except OQ-7.
open_questions:
  OQ-1:
    question: Extraction. Full daily snapshots or change capture, and how the three sources are frozen to one point in time.
    decision: Full daily snapshots of all three sources, cut at one timestamp.
    by: engineering
  OQ-2:
    question: Source of truth. Which system wins on contract status for the flag when systems disagree.
    decision: ConsignTrack, the contract system of record. Disagreements are still reported.
    by: product
  OQ-4:
    question: Delivery. Where the morning list lives.
    decision: A Tableau view beside the Risk Book Summary, plus a morning email with the top of the act tier and a link.
    by: engineering
  OQ-5:
    question: Day boundary. Which time zone defines a contract day.
    decision: Pacific, where ConsignTrack sets expiry dates. To confirm with Ops.
    by: engineering
  OQ-7:
    question: Question layer. Hosting, cost envelope and how accuracy is tested before Ops sees it.
    decision: Open. Refined when E6 comes up.
  OQ-8:
    question: Lots. Split a lot's appraisal across its items, or treat the lot as one item.
    decision: One item per lot for the pilot; the completeness report shows the appraised value in lots.
    by: [engineering, product]

# Engineering's sprint plan (two-week sprints), from refinement.
sprints:
  1: {weeks: 1-2, stories: [E1-S1, E1-S3, E1-S2], note: Spike on ConsignTrack change history; result in week 1 sets gate appraisal_recovery.}
  2: {weeks: 3-4, stories: [E1-S2, E2-S1, E2-S2, E4-S3], note: Release R1 at end of sprint.}
  3: {weeks: 5-6, stories: [E2-S3, E3-S1, E3-S2], note: ConsignTrack team ships the intake appraisal field. Gate go_live at end of sprint.}
  4: {weeks: 7-8, stories: [E4-S1, E5-S2, E4-S2], note: Release R2 in week 7 - E4-S1 as a Midwest morning email.}
  5: {weeks: 9-10, stories: [E4-S1, E5-S1], note: E4-S1 in Tableau for every region. Data contracts signed; conversations started in sprint 1. Release R3.}

# Releases: value reaches people before the full build is done.
releases:
  R1:
    name: Contract book
    week: 4
    stories: [E1-S1, E1-S3, E2-S2, E4-S3]
    who_gets_what: Priya the daily reconciled view of every contract; David exposure already locked in; Maria contracts sortable by days left and sales so far. No prediction.
    success: The monthly report is built from the book instead of by hand, and David reports locked-in exposure from it.
    depends_on_gates: []
  R2:
    name: Midwest pilot
    week: 7
    stories: [E4-S1]
    who_gets_what: Maria the act list for the Midwest as a morning email.
    success: Maria works the list daily; first real lead-time and false-alarm figures arrive.
    trade_off: Runs before data contracts are signed; Priya checks Midwest reconciliation by hand.
    depends_on_gates: [appraisal_recovery, go_live]
  R3:
    name: Full pilot
    week: 10
    stories: [E4-S1, E4-S2, E5-S1, E5-S2]
    who_gets_what: Every region in Tableau, David's exposure view, the weekly scorecard, operating commitments.
    success: The scorecard stays inside its guardrails, and Priya stops checking reconciliation by hand.
    depends_on_gates: [appraisal_recovery, go_live]

epics:

  - key: E1
    title: Trusted contract data
    outcome: One daily, reconciled, reproducible snapshot of every contract, its assets and sales.
    traces: [DPR-1, DPR-2, NFR-1, NFR-3, NFR-5]
    milestone: now
    stories:

      - key: E1-S1
        title: One daily snapshot of every contract
        as: priya
        so_that: a report becomes a query instead of an eight-hour project
        traces: [DPR-1, NFR-1, NFR-3]
        decisions: [OQ-1, OQ-5]
        acceptance:
          - Every Risk contract, active or closed, is joined with its consignor, assets and sales, and carries every required field in the PRD.
          - The three sources reflect the same point in time and land before the Ops day starts. A missing source fails the run instead of landing partial data.
          - Any day's snapshot, from the first day of landing, can be regenerated and comes out the same.
        changed_in_refinement: The 12-month historical rebuild moved to E3-S1; snapshots never taken can't be reproduced.
        tasks: []

      - key: E1-S2
        title: A trustworthy intake appraisal
        as: priya
        so_that: the flag's key input can't be overwritten or quietly go missing
        traces: [NFR-5]
        critical_path: Change to ConsignTrack, a system another team owns.
        decisions: [OQ-8]
        acceptance:
          - The intake appraisal is its own field that repricing can't change, and lots appraised as one line are handled by one rule, the same way every time.
          - Intake values for the last 12 months are recovered from ConsignTrack's change history. If coverage is below 95%, the backtest falls back to a shadow period on new contracts, and the decision is recorded on the roadmap.
          - Every refresh reports appraisal coverage, and contracts below 95% are marked.
        tasks:
          - {key: T1, owner: data eng, task: "Spike, 3 days: does ConsignTrack's change history keep every estimate edit for 12 months? Output: a coverage estimate."}
          - {key: T2, owner: ConsignTrack team (external), task: A write-once intake appraisal field in ConsignTrack, filled at intake. Earliest slot is sprint 3.}
          - {key: T3, owner: data eng, task: Land the new field and add it to the data contract.}
          - {key: T4, owner: data eng, task: "Recover historical intake values: the earliest estimate in change history for each item, marked as recovered, current or missing."}
          - {key: T5, owner: analytics eng, task: "Apply the lot rule: one item per lot, with lot items marked."}
          - {key: T6, owner: analytics eng, task: "Completeness check on every refresh: coverage, contracts below 95% marked, an alert if coverage drops."}
          - {key: T7, owner: analytics eng, task: Coverage report for gate appraisal_recovery.}

      - key: E1-S3
        title: Reconciliation across the three systems
        as: priya
        so_that: nobody acts on a number only one system believes
        traces: [DPR-2]
        decisions: [OQ-2]
        acceptance:
          - Every active contract is marked reconciled or not on every refresh, and the day's rate is one published number.
          - Each disagreement shows the contract, the field and the value in each system. Nothing is silently overwritten.
          - One documented rule decides which status the flag uses when systems disagree.
        tasks: []

  - key: E2
    title: Governed risk metrics
    outcome: The projection, flag and exposure defined once, with daily flag history.
    traces: [DPR-3, DPR-6, NFR-2]
    milestone: now
    stories:

      - key: E2-S1
        title: A daily projection and risk flag per contract
        as: maria
        so_that: falling-behind contracts reach me while there's still time to act
        traces: [DPR-3]
        acceptance:
          - The projection, flag and tier match their PRD definitions. In the worked example the contract projects to about $40,800 by day 30, goes on watch on day 21 and moves to act on day 22.
          - Flag settings and sell-through rates are parameters; changing them changes the results, not a definition or code.
          - Sell-through rates are re-learned from closed contracts on a schedule, and every run records which version it used.
        tasks: []

      - key: E2-S2
        title: Exposure and the facts Ops acts on
        as: [david, maria]
        so_that: both views read the same numbers
        traces: [DPR-3]
        acceptance:
          - Exposure at risk counts act contracts only, exposure locked in covers contracts with nothing left to sell, and shortfall is split over unsold items by appraised value.
          - Each contract shows whether a live auction is still possible and how much unsold value sits on a weak channel for its item type.
        tasks: []

      - key: E2-S3
        title: Flag history and evaluation fields
        as: david
        so_that: lead time and the other success metrics can be measured at all
        traces: [DPR-6, NFR-2]
        acceptance:
          - Each contract's flag and tier are kept per day, append-only, so any past morning list can be rebuilt.
          - First act date, lead time and false positive match the PRD. In the worked example the lead time is 68 days.
          - Every calculated field is in one catalog under its PRD name, and nothing downstream recomputes one.
        tasks: []

  - key: E3
    title: Go-live backtest
    outcome: The pilot settings proven on real history, ending in a go/no-go report.
    traces: [DPR-7]
    milestone: now
    gate: go_live
    stories:

      - key: E3-S1
        title: Replay the pilot flag against today's practice
        as: david
        so_that: we know how much earlier it would have caught last year's underperformers
        traces: [DPR-7]
        depends_on: [E1-S2]
        acceptance:
          - The last 12 months are rebuilt as they stood on each day, and every day is replayed from that view, never from later data, beside a baseline where contracts are noticed in the final week.
        changed_in_refinement: Gained the 12-month historical rebuild from E1-S1.
          - The pilot settings stay fixed. The full settings sweep is reported, but any change to the settings goes back to Product.
        tasks: []

      - key: E3-S2
        title: Go-live report
        as: david
        so_that: the go-live decision is made on evidence, not opinion
        traces: [DPR-7]
        acceptance:
          - Each go-live criterion is shown as met or not met, with its value, beside the prototype's simulated result.
          - False alarms are broken out by channel and by contract size, and the appraisal coverage of the contracts tested is shown.
          - The report regenerates with one command.
        tasks: []

  - key: E4
    title: Ops and Finance views
    outcome: The contract book, Maria's morning list and David's exposure rollups.
    traces: [DPR-1, DPR-4, DPR-5]
    milestone: [now, next]
    stories:

      - key: E4-S1
        title: Maria's morning list
        as: maria
        so_that: I open the contracts that matter most first
        traces: [DPR-5]
        decisions: [OQ-4]
        acceptance:
          - Act contracts are ranked by projected shortfall, watch contracts are listed apart, and contracts with nothing left to sell are left off.
          - Each row shows days to expiry, whether a live auction is still possible, unsold value on a weak channel, and whether it is new today.
          - Contracts that failed reconciliation are marked, not hidden, and the list is ready before the working day.
          - It reaches the Midwest first, as a morning email, then every region in Tableau.
        changed_in_refinement: Staged rollout added so the pilot starts in week 7.
        tasks: []

      - key: E4-S2
        title: David's exposure view
        as: david
        so_that: I can see where the book is at risk without waiting for the quarterly report
        traces: [DPR-4]
        acceptance:
          - Exposure rolls up by region, channel, asset type and consignor, and every rollup adds up to the book total.
          - Locked-in exposure is shown on its own, with a 4-week average beside the daily figure.
          - Every number shows its as-of date.
        tasks: []

      - key: E4-S3
        title: The contract book
        as: [priya, david, maria]
        so_that: the monthly report stops being built by hand, and the losses already locked in are visible before any prediction is
        traces: [DPR-1, DPR-4]
        acceptance:
          - Every contract appears with its sales to date, days to expiry and pacing, shown as information, not as a flag, and refreshed daily.
          - Exposure already locked in, on contracts below target with nothing left to sell, is shown by region and in total.
          - The reconciliation rate and appraisal coverage for the day are shown on the book.
        added_in_refinement: First release, in week 4, independent of the flag.
        tasks: []

  - key: E5
    title: Run it as a product
    outcome: An owner, commitments people can rely on, and the weekly success scorecard.
    traces: [DPR-8, NFR-1, NFR-2, NFR-3, NFR-4, NFR-5]
    milestone: next
    stories:

      - key: E5-S1
        title: Operating commitments
        as: priya
        so_that: people can rely on it without checking it themselves
        traces: [NFR-1, NFR-2, NFR-3, NFR-4, NFR-5]
        acceptance:
          - The product has a named owner, a freshness commitment, and alerts when a refresh is late or a check fails.
          - Data contracts are agreed with the owners of ConsignTrack, Listings and Sales.
          - It has a catalog entry, lineage from source to metric, and access policies.
        tasks: []

      - key: E5-S2
        title: Weekly success scorecard
        as: david
        so_that: we notice if the flag drifts outside its guardrails
        traces: [DPR-8]
        acceptance:
          - Each success metric is aggregated from the evaluation fields and shown against its target, by channel and contract size.
          - A metric outside its guardrail is visibly marked, from the first week of the pilot.
        tasks: []

  - key: E6
    title: Questions in plain language
    outcome: Ops and Finance ask the discovery questions and get governed, tested answers.
    traces: [DPR-9, NFR-4]
    milestone: later
    stories:

      - key: E6-S1
        title: Answer the discovery questions
        as: maria
        so_that: I don't need an analyst for each question
        traces: [DPR-9]
        open_questions: [OQ-7]
        acceptance:
          - The four discovery questions, and rewordings of them, are answered only from catalog fields.
          - Every answer names the metric it used and the as-of date.
        tasks: []

      - key: E6-S2
        title: Safe and tested before Ops sees it
        as: david
        so_that: I never get an invented number
        traces: [DPR-9, NFR-4]
        open_questions: [OQ-7]
        acceptance:
          - Questions outside the governed metrics get a plain "not supported" that says what is supported.
          - Access is read-only and limited to catalog fields; attempts beyond that are logged.
          - A versioned set of at least 30 questions with known answers passes before Ops gets access.
        tasks: []

# Next scope from the PRD. Not broken into stories until the pilot reports.
next_scope:
  - title: Listing-activity signals
    why: Sales and appraisals alone cap the halfway catch near 41%.
  - title: Sell-through curves by asset type, channel and region
    why: One curve for the whole book is the simplest version that passed.
  - title: Suggested interventions per flagged contract
    why: Ops knows a contract is behind but not yet which action fits it.
  - title: Log Ops actions on flagged contracts
    why: Measures the recovery rate, the weakest sizing assumption, and shows Ops which contracts are already worked.
