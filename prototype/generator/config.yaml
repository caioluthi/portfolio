# Assumptions behind the simulated book of contracts.
#
# These are fixed before the backtest runs. Calibration targets come from the
# Phase 2 book (docs/phase-2-opportunity.html); everything else is a stated
# assumption, so the backtest result can be traced back to what was assumed.

seed: 20261022
today: 2026-09-30            # the prototype's "now"; 12 months of closed contracts precede it
history_days: 455            # 12 months of closed contracts + one 90-day lifecycle

book:
  contracts_per_year: 2000   # Phase 2: ~2,000 a year, ~500 active
  lifecycle_days: 90
  target_median_usd: 42000   # lognormal; mean lands near the Phase 2 average of ~$50K
  target_sigma: 0.6
  cancelled_share: 0.02
  consignors: 900
  single_asset_share: 0.12   # one high-value item per contract
  assets_per_contract: {min: 3, mean: 12, max: 40}

regions: [Northeast, Southeast, Midwest, West]

asset_types: [jewelry, watches, handbags, furniture, art, collectibles]

# Price multiplier by asset type and channel: how well each channel suits each
# kind of item. 1.0 is a neutral fit.
channel_fit:
  jewelry:      {app: 1.00, website: 1.05, live: 1.10}
  watches:      {app: 0.95, website: 1.05, live: 1.15}
  handbags:     {app: 1.10, website: 1.00, live: 0.90}
  furniture:    {app: 0.80, website: 0.95, live: 1.10}
  art:          {app: 0.80, website: 0.95, live: 1.20}
  collectibles: {app: 1.00, website: 1.00, live: 1.05}

# How Ops places items today: not always on the best-fitting channel.
placement:
  jewelry:      {app: 0.40, website: 0.40, live: 0.20}
  watches:      {app: 0.30, website: 0.45, live: 0.25}
  handbags:     {app: 0.60, website: 0.35, live: 0.05}
  furniture:    {app: 0.35, website: 0.50, live: 0.15}
  art:          {app: 0.20, website: 0.45, live: 0.35}
  collectibles: {app: 0.40, website: 0.40, live: 0.20}

# A region where demand is weaker, so rollups by region have something to find.
region_demand: {Northeast: 1.02, Southeast: 0.97, Midwest: 0.93, West: 1.03}

pricing:
  # Calibrated so the closed book matches Phase 2: 15% underperforming over 12 months,
  # 18% over 6, and an average shortfall of about 24% of target.
  expected_over_target: 1.55 # asking value vs. target, before channel fit, unsold items and noise
  contract_shock_sigma: 0.22 # demand for this consignor's items, shared by all its assets
  asset_noise_sigma: 0.25
  recent_drift: -0.03        # demand softens in the most recent 6 months
  unsold_base: 0.06          # share of assets that never sell, rising when demand is weak

# Appraised value of each item at intake, as ConsignTrack would hold it. The
# appraiser doesn't know which channel the item will sell on or how strong demand
# for this consignor's items will be, and appraisals carry error.
estimates:
  sigma: 0.30                # lognormal appraisal error around the item's asking value

# When items sell within the 90-day window.
timing:
  # Beta distribution of the sale day as a share of the window, per online channel.
  app:     {a: 1.1, b: 1.9}
  website: {a: 1.3, b: 1.7}
  # Live items sell on the auction date, which falls anywhere from day 20 to day 85.
  live_auction_day: {min: 20, max: 85}
  # Weak demand also slows sales down: the b parameter scales by 1 / shock^k.
  slowdown_k: 1.0

calibration_targets:         # from Phase 2; checked by generate.py --report
  underperformance_rate_12m: 0.15
  underperformance_rate_6m: 0.18
  avg_shortfall_share: 0.24
