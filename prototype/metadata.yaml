# Descriptions for every table, view and column in the prototype dataset.
#
# Applied by apply_metadata.py at the end of build.sh, because reloading a
# table or replacing a view drops its descriptions. The script fails if any
# live column has no description, so new columns can't ship undocumented.
#
# `columns` is the shared glossary: a column means the same thing in every
# table it appears in. A table's own `columns` entry overrides the glossary
# where the meaning is narrower.

columns:
  consignor_id: Unique consignor (CN-nnnnn). Source system ConsignTrack.
  contract_id: Unique Risk contract (CT-nnnnn). Source system ConsignTrack.
  asset_id: Unique asset (AS-nnnnnn). Belongs to exactly one contract.
  listing_id: Unique listing of an asset on a channel (LS-nnnnnn). Source system Listings.
  sale_id: Unique sale of one asset (SL-nnnnnn). Source system Sales.
  home_region: Region the consignor is based in.
  region: Region that manages the contract. Used for exposure rollups by region.
  start_date: First day of the contract window (day 0).
  lifecycle_days: Length of the contract window in days. 90 by default.
  expiry_date: Day the contract window ends; start_date + lifecycle_days. The contract is active up to the day before.
  target_price: Price guaranteed to the consignor, in USD. If realized sales at expiry fall short, Second Avenue pays the difference.
  tier_schedule: Negotiated upside tiers as JSON - share of sales above target that Second Avenue keeps, per band. Carried for context; not used by pilot metrics.
  status: Contract status in ConsignTrack as of today - active, closed or cancelled.
  estimate_usd: Appraised value of the item at intake, in USD, as recorded in ConsignTrack. Doesn't know the channel the item will sell on or current demand, and carries appraisal error.
  asset_type: Item category - jewelry, watches, handbags, furniture, art or collectibles.
  listing_channel: Channel the asset is listed on - app, website or live (auction).
  listed_date: Date the listing went up.
  ended_date: Date the listing ended, by sale or contract expiry. Null while still live.
  listing_status: sold, expired (contract ended unsold) or live.
  sale_date: Date the sale closed.
  gross_amount: Gross sale proceeds in USD.
  channel: Channel the sale happened on - app, website or live (auction).
  today: The prototype's "now". Contracts expiring on or before it are closed; daily rows stop at it.
  flag_threshold: Risk flag fires when projected_final_value is below this share of target_price. Pilot value 0.95.
  flag_day_floor: No risk flag before this many days into the contract window. Pilot value 21.
  realization_prior_share: Weight of the prior that pulls price_realization toward 1, as a share of target_price. Stops the first sale or two from swinging the projection. Pilot value 0.15.
  act_evidence_min: Share of appraised value that must have sold for a flag to be "act" rather than "watch". Pilot value 0.15.
  period: 15-day period of the contract window, 0 to 5 (days 0-14, 15-29, ... 75-89).
  day_from: First day of the period.
  day_to: Last day of the period.
  sell_through: Share of still-unsold appraised value that goes on to sell by expiry, for contracts in this period. Learned from contracts that closed 2025-10-01 to 2026-03-31.
  as_of_date: Day the row describes. Every field is computed only from data dated on or before it.
  days_elapsed: Days since start_date as of as_of_date. Day 0 is the start date.
  elapsed_share: days_elapsed / lifecycle_days, capped at 1. Share of the contract window used up.
  days_to_expiry: expiry_date - as_of_date, in days.
  realized_sales: Gross sale proceeds to date for the contract's assets, counting sales dated on or before as_of_date.
  total_estimate: Appraised value of every item under the contract.
  sold_estimate: Appraised value of the items sold on or before as_of_date.
  unsold_estimate: total_estimate - sold_estimate. Appraised value still to sell.
  pacing_pct: realized_sales / (target_price x elapsed_share). 1.0 is exactly on linear pace to target. Context only; it no longer drives the risk flag.
  price_realization: (realized_sales + prior) / (sold_estimate + prior), prior = realization_prior_share x target_price. How sold items are fetching against their appraisals, pulled toward 1 until there is enough evidence.
  evidence_share: sold_estimate / total_estimate. How much of the contract has resolved; decides watch vs act.
  projected_final_value: realized_sales + unsold_estimate x sell_through x price_realization. Projected sales at expiry, counting what is still unsold.
  projected_shortfall: max(0, target_price - projected_final_value). What the contract is on course to cost in USD if nothing changes.
  risk_flag: TRUE when projected_final_value is below flag_threshold x target_price, on or after flag_day_floor. A daily state, not a prediction; a contract can be flagged, recover and be flagged again.
  risk_tier: act when risk_flag is TRUE and evidence_share >= act_evidence_min; watch when risk_flag is TRUE with less evidence; null when not flagged. Ops reviews act flags; watch flags are context.
  realized_sales_at_close: Gross sale proceeds for sales dated before expiry_date.
  closed_below_target: TRUE when realized_sales_at_close is below target_price, so Second Avenue paid a shortfall.
  first_flag_date: Earliest as_of_date on which risk_flag was TRUE, at either tier. Null if never flagged.
  first_act_date: Earliest as_of_date on which risk_tier was act. Null if never acted on.
  detection_lead_time_days: expiry_date - first_act_date, for contracts that closed below target; 0 if never acted on; null for contracts that met target. Input to the primary success metric.
  flagged_by_halfway: TRUE when first_act_date falls on or before day 45. Input to recall at halfway.
  false_positive: TRUE when the contract had an act flag at some point but closed at or above target. Input to the false-positive guardrail.

  # Morning list, exposure and channel views
  basis_estimate: Appraised value of the item that this row's share of the shortfall is spread over - an unsold item, or any item if nothing is left unsold.
  allocated_shortfall: This item's share of its contract's projected_shortfall, in proportion to basis_estimate. Sums back to the contract's projected_shortfall.
  list_rank: Position on the morning list within its tier, by projected_shortfall, largest first.
  projected_share_of_target: projected_final_value / target_price.
  sales_app: Gross sales to date on the app.
  sales_website: Gross sales to date on the website.
  sales_live: Gross sales to date at live auction.
  unsold_value: Appraised value of the contract's items not yet sold. What Ops can still reprice or move.
  loss_locked_in: TRUE when nothing is left to sell. The shortfall still costs money, but Ops has no inventory left to act on.
  main_unsold_channel: Channel holding the largest share of the contract's unsold appraised value. A label for Ops; exposure is split by item, not assigned to this channel.
  new_today: TRUE when the contract was flagged act for the first time today.
  dimension: Which rollup the row belongs to - book, region, channel, asset_type or consignor.
  value: The value of that dimension, such as Midwest or live.
  exposure_at_risk: Sum of allocated_shortfall for contracts flagged act. Every dimension adds up to the book total.
  exposure_on_watch: Sum of allocated_shortfall for contracts on watch. Reported apart from exposure at risk.
  contracts_act: Contracts flagged act with at least one item in this group.
  contracts_watch: Contracts on watch with at least one item in this group.
  contracts_active: Active contracts with at least one item in this group.
  share_of_unsold_value_at_risk: Share of this group's unsold appraised value that sits in contracts flagged act.
  items_listed: Items listed in this channel and asset type, on contracts that closed in the last 12 months.
  items_sold: Of those, items sold before their contract expired.
  value_realization: Gross sales / appraised value of every listed item, sold or not. Combines price and sell-through.

tables:
  raw_consignors:
    description: Source - consignors, as held in ConsignTrack. One row per consignor. Simulated.
  raw_contracts:
    description: Source - Risk contracts, as held in ConsignTrack. One row per contract, including the PRD worked example CT-EXAMPLE. Simulated.
  raw_assets:
    description: Source - assets under contract, as held in ConsignTrack. One row per asset. Simulated.
  raw_listings:
    description: Source - where and whether each asset is listed, as held in Listings. One row per listing. Simulated.
  raw_sales:
    description: Source - completed sales, as held in Sales. One row per sale. Simulated.
    columns:
      region: Region where the sale happened.
  flag_parameters:
    description: Settings for the risk flag and the prototype's "now". One row. Change these to re-tune the flag; no definition changes.
  sell_through_by_period:
    description: Share of still-unsold appraised value that goes on to sell by expiry, per 15-day period of the contract. One row per period. Learned by experiment/run.py from contracts that closed 2025-10-01 to 2026-03-31.
  exposure_allocation:
    description: Each active contract's projected shortfall as of today, spread over its unsold items by appraised value (PRD DPR-4). One row per contract per item. Lets exposure roll up by channel and asset type as well as region and consignor.
    columns:
      channel: Channel the item is currently listed on - app, website or live - or not yet listed (live items are listed 14 days before their auction).
  ops_morning_list:
    description: Ops' morning list as of today (PRD DPR-5). One row per flagged contract; act contracts ranked by projected shortfall, then watch contracts as context.
  finance_exposure:
    description: Finance's exposure rollups as of today (PRD DPR-4), in long form - one row per dimension value. Every dimension adds up to the book total.
    columns:
      unsold_value: Appraised value of the unsold items in this group.
  channel_performance:
    description: How items sell by channel and asset type, on contracts that closed in the last 12 months. One row per channel and asset type.
    columns:
      channel: Channel the item was listed on - app, website or live.
      sell_through: Share of listed items that sold before their contract expired.
      price_realization: Gross sales / appraised value, for items that sold.
  contract_pacing_daily:
    description: Calculated fields per contract per day, before the flag (PRD section 3). One row per non-cancelled contract per day it was active, up to today. History is replayed as it was - sales and appraised value sold only count sales dated on or before as_of_date.
  contract_daily:
    description: Calculated fields per contract per day, including the projection with unsold inventory and the pilot risk flag and tier (PRD section 3, DPR-3). One row per non-cancelled contract per day it was active, up to today.
  contract_outcome:
    description: Calculated fields at close - the inputs to the success metrics, measured from the first act flag (PRD section 3; Phase 2 success metrics). One row per closed contract.
